; Five build targets share include/ and the same robot_config.h pin map.
;
;   pio run -e motortest             -t upload   open-loop motor + encoder bench test
;   pio run -e sysinfo                -t upload   board inventory: chip, flash, heap, budget
;   pio run -e policy_quick_check     -t upload   motors OFF — sensor/wiring check, prints obs values
;   pio run -e policy_model_validate  -t upload   motors OFF — checks an imported model vs PyTorch
;   pio run -e policy                 -t upload   motors ON  — the real balancing firmware
;
; The three policy_* environments are the SAME firmware built three ways — see
; [env:policy_base] below. Pick one with -e; nothing needs hand-editing.
;
; Debug prints (model info, status lines, slow-inference warnings — NOT the
; safety prints, those are always on) default on for policy_quick_check /
; policy_model_validate and off for policy, since policy's 5 ms control loop
; can't afford them. Override either way on any of the three without touching
; this file:
;   PLATFORMIO_BUILD_FLAGS="-DDEBUG_PRINTS=1" pio run -e policy ...   (force on)
;   PLATFORMIO_BUILD_FLAGS="-DDEBUG_PRINTS=0" pio run -e policy_quick_check ...  (force off)
;
; Keeping motortest/sysinfo separate matters because only the policy builds need
; the model (and therefore the huge_app partition) — the bench test stays small
; and flashes in a couple of seconds.

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

[env:motortest]
build_src_filter = -<*> +<motortest/>
lib_deps =
    madhephaestus/ESP32Encoder@^0.11.7

[env:sysinfo]
build_src_filter = -<*> +<sysinfo/>

; Common settings for all three policy environments. Not built directly — pio
; run -e policy_base does nothing useful on its own, since ROBOT_MODE is unset
; and main.cpp's #ifndef default (MODE_DIAG) kicks in. Use one of the three below.
[env:policy_base]
build_src_filter = -<*> +<policy/>
board_build.partitions = huge_app.csv
; Model weights stream from flash on every inference, so flash clock is directly
; inference latency. The board defaults to 40 MHz; 80 MHz is the part's rated
; speed and roughly halves the streaming time, for free and with no effect on
; numerical output. If the board ever fails to boot after a flash-speed change,
; drop this line back to 40000000L first before suspecting anything else.
board_build.f_flash = 80000000L
lib_deps =
    spaziochirale/Chirale_TensorFLowLite@^2.0.0

; Motors OFF. Prints live sensor + observation values. Start here on any new
; hardware change: flipped encoder sign, swapped IMU axis, etc.
[env:policy_quick_check]
extends = env:policy_base
build_flags =
    -DTF_LITE_STATIC_MEMORY
    -DROBOT_MODE=0

; Motors OFF. Runs the model against 50 fixed PyTorch reference vectors and
; prints the real measured inference time vs the 5 ms budget. Run this after
; importing any new model, before ever arming the real firmware below.
[env:policy_model_validate]
extends = env:policy_base
build_flags =
    -DTF_LITE_STATIC_MEMORY
    -DROBOT_MODE=1

; Motors ON. The actual closed-loop balancing firmware: observe -> infer ->
; drive both wheels. Only use once policy_model_validate has passed and
; policy_quick_check looks sane. Starts by itself after 1 s held still within
; +/-5 deg of upright;
; 'c' over serial recalibrates the gyro.
[env:policy]
extends = env:policy_base
build_flags =
    -DTF_LITE_STATIC_MEMORY
    -DROBOT_MODE=2
