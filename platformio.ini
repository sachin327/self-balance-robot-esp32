; Two build targets share include/ and the same robot_config.h pin map.
;
;   pio run -e motortest -t upload    your open-loop motor + encoder bench test
;   pio run -e sysinfo   -t upload    board inventory: chip, flash, heap, budget
;   pio run -e policy    -t upload    the DQN balancing firmware
;
; Keeping them separate matters because only the policy build needs the 800 KB
; model (and therefore the huge_app partition) — the bench test stays small and
; flashes in a couple of seconds.

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

[env:motortest]
build_src_filter = -<*> +<motortest/>
lib_deps =
    madhephaestus/ESP32Encoder@^0.11.7

[env:sysinfo]
build_src_filter = -<*> +<sysinfo/>

[env:policy]
build_src_filter = -<*> +<policy/>
board_build.partitions = huge_app.csv
lib_deps =
    spaziochirale/Chirale_TensorFLowLite@^2.0.0
build_flags =
    -DTF_LITE_STATIC_MEMORY
